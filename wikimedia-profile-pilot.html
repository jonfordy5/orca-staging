<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORCA Wikimedia Profile Pilot</title><style>body{font:16px/1.55 system-ui;margin:0;background:#f3f7f8;color:#193642}.wrap{max-width:980px;margin:auto;padding:28px 18px}h1{margin:0 0 8px}.note{color:#526e76}select,button{font:inherit;padding:10px 14px;border:1px solid #b8cbd0;border-radius:8px;background:white}button{background:#073b43;color:white;cursor:pointer}section{background:white;border:1px solid #d9e7e9;border-radius:12px;margin:14px 0;padding:19px}section p{margin:7px 0 0}h2{font-size:18px;margin:0}a{color:#087b69}.status{font-weight:bold}.sources{font-size:13px;color:#50656b;overflow-wrap:anywhere}.bad{color:#9c3c29}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:640px){.grid{grid-template-columns:1fr}}.pill{border:1px solid #b6c8cd;border-radius:100px;padding:4px 9px;font-size:12px}</style></head><body><div class="wrap"><h1>ORCA · Wikimedia company profile test</h1><p class="note">Read-only staging quality check. Does not modify the production or staging company workspace. This output is not yet approved.</p><select id="ticker"><option>INTC</option><option>TXRH</option><option>AAPL</option><option>NVDA</option><option>RKLB</option></select> <button id="go">Research company</button> <span class="pill">Wikimedia pilot</span><p id="state" role="status"></p><div id="report"></div><p><a href="./research-workspace.html?environment=orca-staging&ticker=INTC">Return to ORCA staging</a></p></div><script>
const API="https://vbziibatnejoswsdggga.supabase.co/functions/v1/orca-wikimedia-pilot";
const $$=id=>document.getElementById(id);const text=(v)=>typeof v==="string"&&v.trim()?v:"Not established by available source"; 
function el(parent,tag,content,cls){const x=document.createElement(tag);if(cls)x.className=cls;if(content!==undefined&&content!==null)x.textContent=content;parent.append(x);return x}
function section(parent,heading,value,evidence){const c=el(parent,"section");el(c,"h2",heading);el(c,"p",text(value));const d=el(c,"p",undefined,"sources");if(evidence?.url){const a=el(d,"a","Read cited source");a.href=evidence.url;a.target="_blank";a.rel="noopener noreferrer";el(d,"span"," · "+(evidence.section||"source")+(evidence.revision?" · revision "+evidence.revision:""));}else el(d,"span","No verified source for this field");return c}
async function go(){const ticker=$$("ticker").value;$$("report").replaceChildren();$$("state").textContent="Checking Wikimedia sources…";$$("go").disabled=true;
try{const u=API+"?ticker="+encodeURIComponent(ticker);const r=await fetch(u,{cache:"no-cache"});const d=await r.json();if(!r.ok){$$("state").textContent="Pilot failed: "+(d.error||"HTTP "+r.status);return}
$$("state").textContent="DRAFT FOR REVIEW · "+ticker+" · "+(d.source_details?.sections_examined??0)+" article sections indexed";const root=$$("report");section(root,"Company overview",d.overview,d.field_sources?.overview);
const grid=el(root,"div",undefined,"grid");section(grid,"Business focus",d.business_focus,d.field_sources?.business_focus);section(grid,"What they do",d.what_they_do,d.field_sources?.what_they_do);section(root,"How they do it",d.how_they_do_it,d.field_sources?.how_they_do_it);
const src=el(root,"section");el(src,"h2","Verification notes");for(const f of d.review_flags||[])el(src,"p","• "+f,"note");if(d.source_details?.wikipedia){let a=el(src,"a","Wikipedia article");a.href=d.source_details.wikipedia;a.target="_blank";a.rel="noopener noreferrer"}
}catch(e){$$("state").textContent="Wikimedia request failed. The live ORCA workspace has not been changed."}finally{$$("go").disabled=false}}
$$("go").addEventListener("click",go);new URLSearchParams(location.search).has("ticker")&&[...$$("ticker").options].some(o=>o.value===new URLSearchParams(location.search).get("ticker"))&&($$("ticker").value=new URLSearchParams(location.search).get("ticker"));go();
</script></body></html>
