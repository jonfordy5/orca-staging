name: ORCA shared workspace consistency
on:
  push:
    paths:
      - 'research-workspace.html'
      - 'research-workspace-staging.html'
      - 'orca-company-profile.js'
      - 'orca-auto-company-profile.js'
      - 'orca-stock-search.js'
      - 'orca-living-timeline.js'
      - 'orca-timeline-photos.js'
      - 'supabase/functions/orca-timeline-photo-fill/**'
      - 'supabase/functions/orca-timeline-discovery/**'
      - 'sql/orca_timeline_immediate_targeted_completion.sql'
      - 'sql/orca_timeline_open_ended_periodic_updates.sql'
      - 'scripts/test-timeline-history-backfill.cjs'
      - 'scripts/test-timeline-photo-behavior.cjs'
      - 'docs/orca-company-page-standard.md'
      - 'scripts/check-shared-research-workspace.cjs'
      - '.github/workflows/orca-workspace-consistency.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate common stock research layout and controls
        run: node scripts/check-shared-research-workspace.cjs
      - name: Exercise photo relevance and daily-limit behavior
        run: node scripts/test-timeline-photo-behavior.cjs
      - name: Exercise near-completion timeline research safeguards
        run: node scripts/test-timeline-history-backfill.cjs
