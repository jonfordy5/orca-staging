name: ORCA shared workspace consistency
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate common stock research layout and controls
        run: node scripts/check-shared-research-workspace.cjs
      - name: Verify Legends-themed research labels preserve server metric contracts
        run: node --test scripts/test-orca-metric-labels.mjs
      - name: Verify current vs historical Council research integrity
        run: node --test scripts/test-orca-council.mjs
      - name: Verify research publication confirmation and session isolation
        run: node --test scripts/test-research-publication-confirmation.cjs
      - name: Exercise business illustrations, authorization and cache preservation
        run: node scripts/test-timeline-photo-behavior.cjs
      - name: Verify progressive Unsplash searches without provider calls
        run: node scripts/test-unsplash-progressive-search.cjs
      - name: Exercise near-completion timeline research safeguards
        run: node scripts/test-timeline-history-backfill.cjs
      - name: Exercise the complete timeline click across saved and empty stocks
        run: node scripts/test-timeline-completion.cjs
      - name: Verify hybrid brand photography, licenses and cache preservation
        run: node scripts/test-hybrid-timeline-photos.cjs
      - name: Validate isolated ORCA Legends syntax and combat/data contracts
        run: |
          for file in game/*.js; do node --check "$file" || exit; done
          node --test scripts/test-orca-legends.mjs scripts/test-orca-legends-access.mjs scripts/test-orca-legends-audio.mjs scripts/test-orca-legends-animation.mjs
      - name: Install browser for offline mobile layout regression
        run: |
          npm install --prefix "$RUNNER_TEMP/orca-browser" --no-save --package-lock=false playwright@1.62.1
          # Use the GitHub-hosted runner libraries. Avoid flaky apt mirror DNS for optional fonts.
          "$RUNNER_TEMP/orca-browser/node_modules/.bin/playwright" install chromium
      - name: Verify phone swipes, complete frames and unchanged desktop geometry
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-timeline-mobile-layout.cjs
      - name: Verify dark market widgets, symbols, capabilities and responsive layout offline
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-market-widgets-browser.cjs
      - name: Verify Council duel, dated evidence, historic record and mobile layout offline
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-orca-council-browser.cjs
      - name: Verify Company Codex, source links, sparse data and responsive layout offline
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-orca-company-codex-browser.cjs
      - name: Exercise ORCA Legends dungeon, equipment, combat, underdog victory and replay
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-orca-legends-browser.cjs
      - name: Verify sword feedback timing, reduced motion and bounded effects
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-orca-legends-feedback-browser.cjs
      - name: Verify Cinderbolt rules, spell feedback and resource budgets
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-orca-legends-spell-browser.cjs
      - name: Verify animation transitions, measured motion and enemy telegraphs
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-orca-legends-animation-browser.cjs
      - name: Render original sword audio and verify signal and cleanup
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/check-orca-legends-audio-browser.cjs
      - name: Verify contributor authentication, eligibility recheck and Vault entry
        run: NODE_PATH="$RUNNER_TEMP/orca-browser/node_modules" node scripts/test-orca-legends-access-browser.cjs
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: shared-workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: orca-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish only after syntax and regression checks pass
        id: deployment
        uses: actions/deploy-pages@v4
