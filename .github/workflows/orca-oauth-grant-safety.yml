name: ORCA OAuth consent and live-grant safety

on:
  push:
    branches:
      - feat/orca-oauth-mcp-readonly-20261112
    paths:
      - orca-oauth-consent.html
      - scripts/orca-oauth-consent-policy.mjs
      - scripts/test-orca-oauth-live-grant-safety.mjs
      - scripts/test-orca-oauth-grant-transport.mjs
      - scripts/test-orca-oauth-mcp-readonly.mjs
      - supabase/functions/orca-agent-mcp/**
      - .github/workflows/orca-oauth-grant-safety.yml
  pull_request:
    paths:
      - orca-oauth-consent.html
      - scripts/orca-oauth-consent-policy.mjs
      - scripts/test-orca-oauth-live-grant-safety.mjs
      - scripts/test-orca-oauth-mcp-readonly.mjs
      - supabase/functions/orca-agent-mcp/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-unapproved-and-revoked:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test OAuth consent client allowlist and current-grant verification
        run: node --test scripts/test-orca-oauth-live-grant-safety.mjs scripts/test-orca-oauth-grant-transport.mjs scripts/test-orca-oauth-mcp-readonly.mjs scripts/test-orca-oauth-connections.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck MCP Edge Function without deployment
        run: deno check supabase/functions/orca-agent-mcp/index.ts
