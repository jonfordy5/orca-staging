name: ORCA OAuth user-grant revoke UI (code only)

on:
  push:
    branches:
      - feat/orca-oauth-mcp-readonly-20261112
    paths:
      - orca-oauth-connections.html
      - account.html
      - scripts/test-orca-oauth-connections.mjs
      - .github/workflows/orca-oauth-connections.yml
  pull_request:
    paths:
      - orca-oauth-connections.html
      - account.html
      - scripts/test-orca-oauth-connections.mjs
      - .github/workflows/orca-oauth-connections.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-only-grant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert authenticated owner-only grant controls
        run: node --test scripts/test-orca-oauth-connections.mjs
