name: ORCA six-function staging no-token smoke

on:
  push:
    branches:
      - security/orca-browser-edge-block-linked-agents-20261112
    paths:
      - scripts/test-orca-live-edge-unauthorized.mjs
      - .github/workflows/orca-live-edge-unauthorized.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-no-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify six actual staging Edge endpoints reject signed-out requests
        run: node scripts/test-orca-live-edge-unauthorized.mjs
