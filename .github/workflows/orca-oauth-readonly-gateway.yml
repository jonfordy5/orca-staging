name: ORCA OAuth Data API read-only gateway (isolated Postgres)

on:
  push:
    branches:
      - security/orca-oauth-readonly-gateway-20261112
    paths:
      - sql/orca_oauth_readonly_data_api_guard.sql
      - sql/orca_oauth_mcp_audience_hook_candidate.sql
      - scripts/fixtures/orca_oauth_gateway_postgrest_fixture.sql
      - scripts/test-orca-oauth-postgrest-http.mjs
      - scripts/fixtures/orca_oauth_gateway_pg_fixture.sql
      - scripts/fixtures/orca_oauth_gateway_pg_tests.sql
      - scripts/fixtures/orca_oauth_mcp_audience_hook_pg_tests.sql
      - .github/workflows/orca-oauth-readonly-gateway.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-policy-in-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: "orca-test-only"
          POSTGRES_DB: orca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: orca_test
      PGUSER: postgres
      PGPASSWORD: "orca-test-only"
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is installed
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Create isolated fake Supabase roles and RLS data
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/orca_oauth_gateway_pg_fixture.sql
      - name: Load proposed OAuth guard WITHOUT enabling PostgREST globally
        run: psql -X -v ON_ERROR_STOP=1 -f sql/orca_oauth_readonly_data_api_guard.sql
      - name: Load native Auth token hook candidate WITHOUT enabling it
        run: psql -X -v ON_ERROR_STOP=1 -f sql/orca_oauth_mcp_audience_hook_candidate.sql
      - name: Verify approved client-only reads, denied writes, owner RLS, and browser compatibility
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/orca_oauth_gateway_pg_tests.sql
      - name: Verify OAuth audience mapping and normal browser token preservation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/orca_oauth_mcp_audience_hook_pg_tests.sql
      - name: Add ephemeral PostgREST authenticator and fake endpoints
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/orca_oauth_gateway_postgrest_fixture.sql
      - name: Start pinned PostgREST against isolated fixture (environment hook only)
        run: |
          docker run -d --rm --network host --name orca-gateway-test \
            -e PGRST_DB_URI="postgres://authenticator:pgrst-fixture-password@127.0.0.1:5432/orca_test" \
            -e PGRST_DB_SCHEMA="public" \
            -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="orca-ci-postgrest-jwt-hmac-key-1234567890-DO-NOT-USE" \
            -e PGRST_DB_PRE_REQUEST="orca_mcp_private.enforce_readonly_oauth_data_api" \
            -e PGRST_SERVER_PORT="3050" \
            postgrest/postgrest:v14.18
          for i in $(seq 1 30); do
            if curl -s -o /dev/null --max-time 1 "http://127.0.0.1:3050/"; then
              exit 0
            fi
            sleep 1
          done
          docker logs orca-gateway-test
          exit 1
      - name: Validate real signed HTTP requests cannot bypass read-only rules
        run: node --test scripts/test-orca-oauth-postgrest-http.mjs
      - name: Show isolated PostgREST diagnostics only on failure
        if: failure()
        run: docker logs orca-gateway-test || true
      - name: Confirm no PostgREST project role setting was activated
        run: |
          result=$(psql -X -Atc "SELECT count(*) FROM pg_db_role_setting WHERE array_to_string(setconfig, ',') LIKE '%pgrst.db_pre_request%';")
          test "$result" = "0"
