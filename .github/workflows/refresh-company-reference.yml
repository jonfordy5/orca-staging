name: Refresh free company reference data
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-company-reference-index.py'
      - '.github/workflows/refresh-company-reference.yml'
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact MIT-licensed stock facts index
        run: python scripts/build-company-reference-index.py
      - name: Commit changed reference facts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company-profile-index/
          git diff --cached --quiet || (git commit -m "Refresh free company reference facts" && git push)
